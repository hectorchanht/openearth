<style>:root{--bg:#0a0a0b;--panel:#131315;--line:#26262b;--text:#f5f2ee;--muted:#a8a29b;--accent:#e8590c;--accent-soft:#ff8a3d;--radius:16px;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Noto Sans CJK TC",sans-serif;--serif:Georgia,"Times New Roman","Noto Serif TC","Noto Serif CJK TC",serif}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.55}.wrap{max-width:720px;margin:0 auto;padding:0 20px}a{color:var(--accent-soft)}header.utility{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line)}.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:inherit;font-weight:700;min-width:0}.brand img{width:40px;height:40px;flex:0 0 auto}.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lang-switch{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--panel);flex:0 0 auto}.lang-switch button{min-width:48px;min-height:34px;padding:5px 12px;border:0;border-radius:999px;background:transparent;color:var(--muted);cursor:pointer;font:600 .88rem var(--sans)}.lang-switch button[aria-pressed="true"]{background:var(--text);color:var(--bg)}.hero{padding:38px 0 8px}.hero .mark{width:84px;height:84px}.hero h1{font-size:clamp(2.2rem,9vw,3.4rem);line-height:1.08;margin:.35em 0 .25em;font-weight:800;overflow-wrap:break-word}.hero .promise{font-family:var(--serif);font-size:clamp(1.1rem,4.6vw,1.4rem);line-height:1.55;color:#e8e2d9;max-width:34em}.status{display:inline-flex;max-width:100%;padding:6px 14px;border:1px solid var(--accent);border-radius:999px;color:var(--accent-soft);font-size:.88rem;font-weight:600;margin-top:16px;overflow-wrap:break-word}section.block{padding:22px 0 4px}section.block>h2{font-size:clamp(1.4rem,6vw,1.9rem);margin:14px 0 10px}.card,.step{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin:0 0 14px;min-width:0}.card p{margin:0}.step .n{color:var(--accent-soft);font-size:.78rem;text-transform:uppercase;letter-spacing:.13em;font-weight:700}.step h3{margin:.35em 0 .3em;font-size:1.15rem}.step p{margin:0;color:#e8e2d9}footer.site{border-top:1px solid var(--line);margin-top:36px;padding:22px 0 30px;color:var(--muted);font-size:.9rem}footer.site .row{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between}</style></head><body><div class="wrap">

<script>const L={"k0": ["One interactive, discovery-first map of everything, in zoom layers. Discovery first: the whole map visible, walk it — no search gate. Links are the value: myth-place, sea-shore, planet-sky cross-linked. Data first: fill content before features. Eternal accretion: the map is never finished — layers and places keep being added, forever.", "一幅互動、discovery-first 嘅萬物地圖，用 zoom layers 分層。Discovery first：成幅地圖睇得到，自己行——冇 search gate。Links 係價值：神話同地方、海同岸、行星同天空互相連結。Data first：先填內容，後加功能。Eternal accretion：地圖永遠唔會完成——layers 同地方會不停加落去，永遠。"], "k1": ["Layer 1 — Surface: countries and geography: where everything is, the basic literacy of the planet.", "第一層——地表：國家同地理：邊度喺邊度，呢個星球最基本嘅 literacy。"], "k2": ["Layer 2 — Myth (Classic of Mountains and Seas, 山海經): laid OVER the real map. Myth entries are labelled legend (傳說), geography labelled fact (事實) — truth-labelling, as always — and the LINK between them is the content.", "第二層——神話層（山海經）：《山海經》鋪喺真地圖上面。神話條目標明「傳說」，地理標明「事實」——一如既往嘅 truth-labelling——而佢哋之間嘅 LINK 就係內容。"], "k3": ["Layer 3 — Ocean: the seas and oceans as their own world to learn. Layer 4 — Space: zoom out past the Earth: astronomy, the planets, the sky above the map.", "第三層——海洋：海同洋係佢哋自己一個要學嘅世界。第四層——太空：zoom out 出地球之外：天文、行星、地圖上面嘅天空。"], "k4": ["Roadmap — founding brief in preparation", "路線圖 — 立派文件準備中"], "k5": ["One living map of the Earth — geography, myth, ocean, space.", "一幅活嘅地球圖——地理、神話、海洋、太空。"], "k6": ["So people on Earth know the geography of countries — and the myths beside us are not vanished mist: they still live in real places, names and stories, right beside us in reality.", "俾地球人知道國家嘅地理——而我哋身邊嘅神話唔係消失咗嘅虛無縹緲：佢哋仲喺真實地方、地名同故事入面，喺我哋身邊活住。"], "k7": ["Founding — initialized, first release in preparation", "創建中 — 已初始化，第一版準備中"], "k8": ["What it is", "係乜嚟"], "k9": ["END GOAL", "最終目標"], "k10": ["So people on Earth know the geography of countries — learn where everything is; learn the seas; learn the real myth stories that still live beside us in reality; look at the Earth, look at the ocean, then look outward to space and the different planets. This is absolutely important.", "俾地球人知道國家嘅地理——知道邊度喺邊度；學習海；學習真正嘅神話故事，佢哋仲喺現實入面我哋身邊；睇地球、睇個海，再向外睇太空、唔同嘅星球。呢個絕對好重要。"], "k11": ["ROADMAP", "路線圖"], "k12": ["STATUS", "狀態"], "k13": ["Founding — initialized, first release in preparation. No features are live yet; this page is the founding record.", "創建中 — 已初始化，第一版準備中。暫時未有任何功能上線；呢一頁係立派記錄。"]};function setLang(l){document.querySelectorAll('[data-i]').forEach(e=>{const v=L[e.dataset.i];if(v)e.textContent=l==='zh'?v[1]:v[0];});document.getElementById('b-en').setAttribute('aria-pressed',l==='en');document.getElementById('b-zh').setAttribute('aria-pressed',l==='zh');document.documentElement.lang=l==='zh'?'zh-Hant':'en';}document.getElementById('b-en').onclick=()=>setLang('en');document.getElementById('b-zh').onclick=()=>setLang('zh');setLang('en');</script></body></html>
